<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Musikpaus</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* The player is 1280x720 and scaled to the screen: YouTube picks quality
       from the player's size, and 1080p/4K used too much memory on the TV. */
    #player { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    // Musikpaus för TV4 Play Community (LG webOS): spelar musikvideor medan en
    // reklampaus pågår i en direktsändning. Appen visar sidan i en iframe och
    // styr den med postMessage. YouTube kräver att spelaren bäddas in från en
    // riktig webbadress, därför ligger sidan här och inte i appen.
    //
    // Kommandon från appen: unmute, mute, fade (volym, ms), pause, play, next.
    // Parametrar: ?v=id1,id2 egna videor, ?list=PL… en YouTube-spellista, ?wait=1 vänta på play,
    // ?mute=1 starta utan ljud. Skriven för TV:ns Chromium 79 (ES5).
    (function () {
      var params = new URLSearchParams(location.search);
      // Tessans och Stefans lista (2026-11-18), varvad mellan artisterna.
      // Alla 24 spelade inbäddat på TV:n via den här sidan.
      var DEFAULT = [
        'gG_dA32oH44', // Jay-Z & Kanye West – Ni**as In Paris
        'gT2wY0DjYGo', // Joost Klein – Europapa
        'K6BRna4_bmg', // bbno$ & Rich Brian – edamame
        '9bZkp7q19f0', // PSY – Gangnam Style
        'PDplREoE5n4', // ceo@business.net – cry about it
        'ViwtNLUqkMY', // Beyoncé – Crazy In Love ft. JAY Z
        'PsO6ZnUZI0g', // Kanye West – Stronger
        'jDVng1l01JU', // lentra – i could die
        'MWXdpxgbndw', // bbno$, ceo@business.net & jungle bobby – take a trip (prod. lentra)
        'LMzAssOr2zE', // Joost, Ski Aggu & Otto Waalkes – Friesenjung
        'ASO_zypdnsQ', // PSY – Gentleman
        'N2Y2vQ-1m7M', // Y2K, bbno$ – Lalala
        'WDZJPJV__bQ', // Beyoncé – Formation
        'w-LSnjawbGI', // ceo@business.net – bad
        '6vwNcNOTVzY', // Kanye West – Gold Digger ft. Jamie Foxx
        'NcQRJflRstw', // bbno$ – nursery (prod. lentra)
        '4m1EFMoRFvY', // Beyoncé – Single Ladies (Put a Ring on It)
        'FrG4TEcSuRg', // PSY – DADDY ft. CL
        'HAjWFhRW5Ic', // Joost – Hate Music
        'z2mNX-CpQe8', // ceo@business.net – wanna be ft. hyphen
        'QuvqzlxEO6g', // bbno$ – it boy
        'Osxpc6ZH0FA', // bbno$ – imma (prod. lentra)
        'VBmMU_iwe6U', // Beyoncé – Run the World (Girls)
        'Co0tTeuUVhU'  // Kanye West – Heartless
      ];
      var ids = (params.get('v') || '').split(',').filter(function (id) { return /^[\w-]{11}$/.test(id); });
      if (!ids.length) ids = DEFAULT;
      var list = params.get('list');
      var muted = params.get('mute') === '1';
      // ?wait=1: load and cue the video without playing; the app sends 'play'
      // when the ad break starts, so the music starts at once.
      var wait = params.get('wait') === '1';
      // ?prime=1 (with wait): play a moment without sound and pause at the
      // start, so YouTube has already fetched and buffered the video when the
      // app sends 'play'.
      var prime = wait && params.get('prime') === '1';
      var priming = false;
      var KEY = 'musikpaus-senaste';
      // Fortsätt med nästa video i nästa reklampaus.
      var start = 0;
      try { var last = ids.indexOf(localStorage.getItem(KEY)); if (last >= 0) start = (last + 1) % ids.length; } catch (e) {}
      var order = ids.slice(start).concat(ids.slice(0, start));
      var player = null;

      function send(message) {
        message.from = 'musikpaus';
        if (parent !== window) parent.postMessage(message, '*');
      }
      // No subtitles: YouTube turns captions on by itself for some videos
      // (for example Korean ones), so unload the caption module on every start.
      function noCaptions() {
        try { player.unloadModule('captions'); } catch (e) {}
        try { player.unloadModule('cc'); } catch (e) {}
      }
      function current() {
        var data = player && player.getVideoData ? player.getVideoData() : {};
        return { id: data.video_id || '', title: data.title || '' };
      }

      window.onYouTubeIframeAPIReady = function () {
        var vars = { autoplay: wait ? 0 : 1, controls: 0, rel: 0, playsinline: 1, iv_load_policy: 3, cc_load_policy: 0, mute: muted ? 1 : 0, origin: location.origin };
        if (list) { vars.listType = 'playlist'; vars.list = list; }
        // `playlist` must not be empty: a single video loops by listing itself
        // (an empty value gave error 150 for every video on the TV).
        else { vars.playlist = order.length > 1 ? order.slice(1).join(',') : order[0]; vars.loop = 1; }
        player = new YT.Player('player', {
          width: 1280, height: 720, videoId: list ? undefined : order[0], playerVars: vars,
          events: {
            onReady: function (event) {
              noCaptions();
              if (!wait) event.target.playVideo();
              else if (prime) { priming = true; event.target.mute(); event.target.playVideo(); }
              send({ type: 'ready', waiting: wait, priming: priming });
            },
            onStateChange: function (event) {
              var video = current();
              if (priming) {
                // Not the real start: stop at the beginning and keep buffering.
                if (event.data === 1) {
                  priming = false;
                  player.pauseVideo(); player.seekTo(0, true);
                  send({ type: 'primed', id: video.id, title: video.title });
                }
                return;
              }
              if (event.data === 1 || event.data === 3) noCaptions();
              if (event.data === 1 && video.id) { try { localStorage.setItem(KEY, video.id); } catch (e) {} }
              send({ type: 'state', state: event.data, id: video.id, title: video.title });
            },
            // 101/150: ägaren tillåter inte inbäddning. Hoppa till nästa.
            onError: function (event) { send({ type: 'error', code: event.data, id: current().id }); player.nextVideo(); }
          }
        });
      };

      // Fade the volume to `to` (0–100) over `ms` milliseconds.
      var fadeTimer = null;
      function fade(to, ms) {
        clearInterval(fadeTimer);
        var from = player.getVolume ? player.getVolume() : 100, steps = Math.max(1, Math.round((ms || 2000) / 100)), step = 0;
        fadeTimer = setInterval(function () {
          step++;
          player.setVolume(Math.round(from + (to - from) * step / steps));
          if (step >= steps) { clearInterval(fadeTimer); if (to === 0) player.pauseVideo(); }
        }, 100);
      }

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.to !== 'musikpaus' || !player) return;
        if (data.cmd === 'fade') fade(data.volume || 0, data.ms);
        else if (data.cmd === 'unmute') { player.unMute(); player.setVolume(data.volume || 100); }
        else if (data.cmd === 'mute') player.mute();
        else if (data.cmd === 'pause') player.pauseVideo();
        else if (data.cmd === 'play') { if (!muted) { player.unMute(); player.setVolume(data.volume || 100); } player.playVideo(); }
        else if (data.cmd === 'next') player.nextVideo();
      });

      function fit() {
        var element = document.getElementById('player');
        if (element) element.style.transform = 'scale(' + Math.min(window.innerWidth / 1280, window.innerHeight / 720) + ')';
      }
      window.addEventListener('resize', fit);
      setInterval(fit, 1000); // the API replaces #player with an iframe

      var api = document.createElement('script');
      api.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(api);
    })();
  </script>
</body>
</html>
